version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: asrs_postgres
    restart: always
    environment:
      POSTGRES_USER: asrs
      POSTGRES_PASSWORD: asrs_secure_password
      POSTGRES_DB: asrs_db
      TZ: Asia/Dubai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: asrs_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: